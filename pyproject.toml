[project]
name = "payerbench"
version = "1.0.0"
description = "A tau2-bench domain for health-plan member services: policy, synthetic database, tools and 104 simulated calls"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rick Clark" }]
dependencies = [
    "tau2",
    "faker>=30",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
payerbench = "payerbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# tau2-bench is installed from Sierra's GitHub tag; it is not on PyPI at this version.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/payerbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "v1.0.1" }
